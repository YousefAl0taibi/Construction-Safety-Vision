[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-safety-vision"
version = "0.1.0"
description = "GPU-ready construction PPE detection, tracking, and safety event engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "onnxruntime>=1.20,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.18,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
safety-vision = "safety_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

